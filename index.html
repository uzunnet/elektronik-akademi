<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elektronik Akademi — Sıfırdan Profesyonel Elektronik</title>
<meta name="description" content="Devre kartı odaklı, kapsamlı ve profesyonel elektronik eğitim platformu. Teori, ölçüm, güç elektroniği, arıza bulma, osiloskop ve AI hoca.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ÜST BAR -->
  <header class="topbar">
    <button id="menu-toggle">☰</button>
    <div class="brand" id="brand">
      <span class="logo">⚡</span>
      <span>Elektronik<span style="color:var(--red)">Akademi</span></span>
    </div>
    <nav class="top-nav">
      <button data-view="home" class="active">Ana Sayfa</button>
      <button data-view="sets">Setler</button>
      <button data-view="sim">🔧 Simülatör</button>
      <button data-view="plc">⚡ PLC</button>
      <button data-view="figs">📐 Şekiller</button>
      <button data-view="tools">Araçlar</button>
      <button data-view="glossary">Sözlük</button>
      <button data-view="ai" class="ai">🤖 AI Hoca</button>
    </nav>
  </header>

  <!-- GÖVDE -->
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-top" style="padding:14px 14px 6px;display:flex;justify-content:space-between;align-items:center">
        <small style="text-transform:uppercase;letter-spacing:1px;font-size:11px;color:var(--muted)">Müfredat</small>
        <button class="btn tiny ghost" id="reset-btn" title="İlerlemeyi sıfırla">↺</button>
      </div>
      <nav id="sidebar-nav"></nav>
    </aside>
    <main class="content" id="content"></main>
  </div>

  <!-- AI AYARLARI MODALI -->
  <div class="modal-back" id="modal-back"></div>

  <!-- BİLDİRİM -->
  <div class="toast" id="toast"></div>

  <!-- VERİ VE MANTIK -->
  <script src="js/data-1.js"></script>
  <script src="js/data-2.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/figures.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/sim-core.js"></script>
  <script src="js/sim-view.js"></script>
  <script src="js/plc.js"></script>
  <script src="js/plc-scenes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
